<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get a screenshot</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-container">
      <h1 class="app-title">Get a screenshot</h1>
      <p class="app-text">
        Enter a URL for a website and you will get a screenshot of the website.
      </p>
      <form class="url-form">
        <input
          class="url-input"
          type="text"
          placeholder="e.g. hackyourfuture.com"
        />
        <button class="submit-button" type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
